# 会議の検出の確認用の道具（crates/core/examples/meeting_probe.rs）だけを、Windows でビルドして成果物にする。
# 配布の前に実機で確かめるとき、テストやインストーラを含む ci.yml の全体を待たずに作り直すためのもの（手動でだけ動かす）。
#
# - Secret は使わない。
# - アクションは、タグではなくコミットのハッシュで固定している（ci.yml と同じ）。
name: meeting-probe

on:
  workflow_dispatch:

# このワークフローに渡すトークンは、リポジトリの読み取りだけ
permissions:
  contents: read

jobs:
  build:
    name: 会議の検出の確認用の道具（Windows）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: ビルド
        run: cargo build -p kiroscribe-core --release --example meeting_probe --locked

      # 音声デバイスのないランナーでも、オーディオのセッションの一覧を読めて、止まらずに終わることを確かめる
      - name: 動作確認
        run: target/release/examples/meeting_probe.exe --once

      - name: 成果物として保存
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/release/examples/meeting_probe.exe
          archive: false
          if-no-files-found: error
          retention-days: 14
