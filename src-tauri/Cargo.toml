[package]
name = "kiroscribe"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kiroscribe - AI 会議メモ"

[lib]
name = "kiroscribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# E2E テスト用の差し替え口（src/e2e.rs と crates/core/src/e2e/）を有効にする。リリース用のビルドでは付けない
e2e = ["kiroscribe-core/e2e"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kiroscribe-core = { path = "../crates/core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"

# 起動時に起動する登録は、Windows では自前で行う（background.rs）。ほかの OS でだけ、このライブラリを使う
[target.'cfg(not(windows))'.dependencies]
tauri-plugin-autostart = "2"

[dev-dependencies]
# コマンドを模擬のランタイムで呼ぶテスト（src/ipc_tests.rs）用: tauri::test と、外部の API の模擬サーバー
tauri = { version = "2", features = ["test"] }
wiremock = "0.6"
