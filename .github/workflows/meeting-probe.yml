# 会議の検出の確認用の道具（crates/core/examples/meeting_probe）だけを、Windows でビルドして成果物にする。
# 実機で確かめるとき、テストやインストーラを含む ci.yml の全体を待たずに作り直すためのもの。
# 手動で動かすほか、会議の検出の部品か確認用の道具を変えたプルリクエストでも動く。
# 判定表の印（窓・窓の中の部品・録音と再生のセッション）が実際に読めて、製品と同じ判定になることも、
# 合成のプログラムと模擬の会議のページで確かめる（rules ジョブ）。
#
# - Secret は使わない。
# - アクションは、タグではなくコミットのハッシュで固定している（ci.yml と同じ）。
name: meeting-probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/core/src/meetings.rs
      - crates/core/src/meeting_facts.rs
      - crates/core/src/meeting_rules.rs
      - crates/core/src/meeting_rules.toml
      - crates/core/src/meeting_judge.rs
      - crates/core/src/audio_sessions.rs
      - crates/core/examples/meeting_probe/**
      - crates/core/Cargo.toml
      - crates/core/examples/hold_mic.rs
      - .github/workflows/meeting-probe.yml

# 新しいコミットが来たら、同じプルリクエストの古いコミットの実行を止める
concurrency:
  group: meeting-probe-${{ github.ref }}
  cancel-in-progress: true

# このワークフローに渡すトークンは、リポジトリの読み取りだけ
permissions:
  contents: read

jobs:
  build:
    name: 会議の検出の確認用の道具（Windows）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: ビルド
        run: cargo build -p kiroscribe-core --release --example meeting_probe --locked

      # 音声デバイスのないランナーでも、オーディオのセッションの一覧を読めて（読めなければ終了コード 1）、止まらずに終わることを確かめる
      - name: 動作確認
        run: target/release/examples/meeting_probe.exe --once --require-sessions

      - name: 成果物として保存
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/release/examples/meeting_probe.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

  # 判定表の印が実際に読めて、製品と同じ判定になることを確かめる。
  # hold_mic を Slack.exe の名前で動かし（マイクを使い、既定の再生のデバイスに小さな音を流し、「退出」のボタンのある窓を出す）、
  # Edge で模擬の Google Meet のページ（参加中: 退出のボタン。待機画面: 参加のボタン）を開く。
  # マイクの許可の確認は、起動の引数（--use-fake-ui-for-media-stream）で自動で通す
  rules:
    name: 判定表の印と判定（Windows）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: 仮想のオーディオケーブルのインストール
        uses: LABSN/sound-ci-helpers@e9d6ba52163a3283714a68412036ddf33f78d49c # v1

      # Windows のプライバシー設定で、デスクトップ アプリがマイクを使えるようにする（ランナーの既定では拒否されている）
      - name: マイクへのアクセスを許可
        shell: pwsh
        run: |
          $base = 'CapabilityAccessManager\ConsentStore\microphone'
          $paths = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\$base",
                   "HKCU:\Software\Microsoft\Windows\CurrentVersion\$base",
                   "HKCU:\Software\Microsoft\Windows\CurrentVersion\$base\NonPackaged"
          foreach ($p in $paths) {
            if (-not (Test-Path $p)) { New-Item -Path $p -Force | Out-Null }
            Set-ItemProperty -Path $p -Name Value -Value Allow
          }

      - name: ビルド
        run: cargo build -p kiroscribe-core --example hold_mic --example meeting_probe --locked

      - name: 判定表の印と判定
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $probe = (Resolve-Path 'target/debug/examples/meeting_probe.exe').Path
          $work = Join-Path $env:RUNNER_TEMP 'rules'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $slack = Join-Path $work 'Slack.exe'
          Copy-Item target/debug/examples/hold_mic.exe $slack
          $joined = Join-Path $work 'meet.html'
          @'
          <!doctype html><html><head><meta charset="utf-8"><title>Meet - abc-defg-hij</title></head><body>
          <button aria-label="Leave call">x</button>
          <button aria-label="Turn on microphone">m</button>
          <script>navigator.mediaDevices.getUserMedia({ audio: true });</script>
          </body></html>
          '@ | Set-Content -Encoding UTF8 $joined
          $waiting = Join-Path $work 'meet-wait.html'
          @'
          <!doctype html><html><head><meta charset="utf-8"><title>Meet - abc-defg-hij</title></head><body>
          <p>参加の準備は整いましたか?</p>
          <button aria-label="Join now">j</button>
          <script>navigator.mediaDevices.getUserMedia({ audio: true });</script>
          </body></html>
          '@ | Set-Content -Encoding UTF8 $waiting
          $edge = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          function Start-Edge([string]$target) {
            $userData = Join-Path $work ("edge-" + [guid]::NewGuid())
            $edgeArgs = @('--no-first-run', '--no-default-browser-check', '--use-fake-ui-for-media-stream', "--user-data-dir=$userData", '--new-window', "file:///$($target -replace '\\', '/')")
            Start-Process -FilePath $edge -ArgumentList $edgeArgs | Out-Null
          }
          # 確認用の道具を、決めた秒数だけ動かして、書き出したものを返す（製品と同じく、2 回以上調べたあとの判定を見る）
          function Invoke-Probe([string]$label, [int]$seconds) {
            Write-Host "=== $label"
            $file = Join-Path $work ("probe-" + [guid]::NewGuid() + ".txt")
            $stdin = Join-Path $work 'stdin.txt'
            "ci 目印 $label" | Set-Content -Encoding UTF8 $stdin
            $running = Start-Process -FilePath $probe -ArgumentList '--titles', '--output', $file -RedirectStandardInput $stdin -RedirectStandardOutput (Join-Path $work 'stdout.txt') -PassThru -WindowStyle Hidden
            Start-Sleep -Seconds $seconds
            Stop-Process -Id $running.Id -Force -ErrorAction SilentlyContinue
            $output = Get-Content -Raw -Encoding UTF8 $file
            Write-Host $output
            return $output
          }
          $hold = Start-Process -FilePath $slack -ArgumentList '120', '--play', '--window', 'HoldMicSlackWindow', '--button', 'ハドルから退出する' -PassThru
          $failures = @()
          try {
            Start-Edge $joined
            $output = Invoke-Probe '参加中の Meet のページと、Slack の名前のプログラム' 20
            $checks = [ordered]@{
              '録音のセッション'                 = '(?m)^\s*録音 active slack\.exe'
              '再生のセッション（音あり）'       = '(?m)^\s*再生 active slack\.exe 音あり（ピーク \d\.\d{3}）'
              'ブラウザの録音のセッション'       = '(?m)^\s*録音 active msedge\.exe'
              '会議のページの窓と印'             = '(?m)^\s*窓 msedge\.exe 0x[0-9a-f]+ クラス=Chrome_WidgetWin_1 表示 題「Meet - abc-defg-hij.*印: .*Google Meet の退出ボタン（強）'
              '退出のボタン'                     = '(?m)^\s*窓 msedge\.exe 0x[0-9a-f]+ の部品: \d+ 個を調べた。.*Leave call（Button）'
              # 先に Slack ハドルが会議中になると、Meet は「ほかの会議」になり、開始は知らせない（MTG-010）
              'Meet の参加中の判定'             = '(?m)^\s*Google Meet: 参加中（msedge\.exe の窓） 退出ボタン（強）'
              'Slack の退出のボタン'             = '(?m)^\s*Slack ハドル: 参加中（slack\.exe の窓） 退出ボタン（強）'
              '2 つの会議の段階'                 = '(?m)^\s*段階: 会議中（.+）、ほかの会議: (Google Meet|Slack ハドル)'
              '目印'                             = '(?m)^\[\d\d:\d\d:\d\d\] ◆ 目印 1: ci 目印'
            }
            foreach ($name in $checks.Keys) {
              $ok = $output -match $checks[$name]
              "確認: $name → $ok"
              if (-not $ok) { $failures += $name }
            }
            # 参加前の待機画面（題もマイクも参加中と同じ）では、参加ボタンが打ち消しの印になり、Meet を始めない
            Stop-Process -Name msedge -Force -ErrorAction SilentlyContinue
            Stop-Process -Id $hold.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            Start-Edge $waiting
            $output = Invoke-Probe 'Meet の待機画面' 20
            $ok = ($output -match '(?m)^\s*Google Meet: 待機（msedge\.exe の窓） .*待機画面の参加ボタン（打ち消し）') -and ($output -notmatch '会議の開始を確定: Google Meet')
            "確認: 待機画面は参加中にしない → $ok"
            if (-not $ok) { $failures += '待機画面' }
          } finally {
            Stop-Process -Id $hold.Id -Force -ErrorAction SilentlyContinue
            Stop-Process -Name msedge -Force -ErrorAction SilentlyContinue
          }
          if ($failures.Count -gt 0) { throw "確かめられなかったこと: $($failures -join '、')" }
