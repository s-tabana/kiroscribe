[package]
name = "kiroscribe-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kiroscribe のUI非依存ロジック（保存・音声処理・文字起こし・Claude API）"

[features]
# E2E テスト用の差し替え口（接続先・音声・データの場所など。crates/core/src/e2e/）を有効にする。
# リリース用のビルドでは付けない
e2e = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
rusqlite = { version = "0.43", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "json", "multipart", "stream"] }
futures-util = "0.3"
cpal = "0.18"
keyring-core = "1"
# デバッグ用のログの書き出し（debug_bundle.rs）
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_Packaging_Appx", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
# 会議の検出で、オーディオのセッションの一覧を読む（mic_sessions.rs）。cpal と同じ版を使う
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

# 資格情報マネージャーの中身を、keyring を通さずに Windows の API で直接確かめるテスト用。
# ToolHelp・Wdk_System_Threading・Storage_FileSystem は、確認用の道具（examples/meeting_probe）が
# プロセスの親と種類、実行ファイルの版情報を読むため
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Diagnostics_ToolHelp", "Wdk_System_Threading", "Win32_Storage_FileSystem"] }
# 会議の検出の確認用の道具（examples/meeting_probe）で、音の大きさ・端点の名前・窓の中の部品（UI Automation）を読む。
# 製品のビルドには入らない
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio_Endpoints", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Accessibility", "Win32_System_Ole"] }

# 確認用の道具の、OS によらない部分の単体テストを cargo test で動かす
[[example]]
name = "meeting_probe"
path = "examples/meeting_probe/main.rs"
test = true
