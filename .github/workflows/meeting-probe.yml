# 会議の検出の確認用の道具（crates/core/examples/meeting_probe.rs）だけを、Windows でビルドして成果物にする。
# 配布の前に実機で確かめるとき、テストやインストーラを含む ci.yml の全体を待たずに作り直すためのもの。
# 手動で動かすほか、会議の検出の部品か確認用の道具を変えたプルリクエストでも動く。
# 会議中を示しうる手がかり（音の大きさ・窓・窓の中の部品・カメラ・目印・ファイルへの書き出し）が出ることも、
# 合成のプログラムと模擬の会議のページで確かめる（signals ジョブ）。
#
# - Secret は使わない。
# - アクションは、タグではなくコミットのハッシュで固定している（ci.yml と同じ）。
name: meeting-probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/core/src/meetings.rs
      - crates/core/src/mic_sessions.rs
      - crates/core/src/mic_store.rs
      - crates/core/examples/meeting_probe/**
      - crates/core/Cargo.toml
      - crates/core/examples/hold_mic.rs
      - .github/workflows/meeting-probe.yml

# 新しいコミットが来たら、同じプルリクエストの古いコミットの実行を止める
concurrency:
  group: meeting-probe-${{ github.ref }}
  cancel-in-progress: true

# このワークフローに渡すトークンは、リポジトリの読み取りだけ
permissions:
  contents: read

jobs:
  build:
    name: 会議の検出の確認用の道具（Windows）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: ビルド
        run: cargo build -p kiroscribe-core --release --example meeting_probe --locked

      # 音声デバイスのないランナーでも、オーディオのセッションの一覧を読めて（読めなければ終了コード 1）、止まらずに終わることを確かめる
      - name: 動作確認
        run: target/release/examples/meeting_probe.exe --once --require-sessions

      - name: 成果物として保存
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/release/examples/meeting_probe.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

  # 録音のストリームを止めたとき・閉じたとき・プロセスが終わったときに、オーディオのセッションの状態
  # （Active・Inactive・Expired）がどう変わるかを、仮想のオーディオケーブル（VB-CABLE。e2e.yml と同じ）で確かめて表示する。
  # hold_mic を Zoom.exe（ストリームを止めて待つ）と Discord.exe（ストリームを閉じて待つ）の名前で動かす
  session-states:
    name: オーディオのセッションの状態の変わり方（Windows）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: 仮想のオーディオケーブルのインストール
        uses: LABSN/sound-ci-helpers@e9d6ba52163a3283714a68412036ddf33f78d49c # v1

      # Windows のプライバシー設定で、デスクトップ アプリがマイクを使えるようにする（ランナーの既定では拒否されている）
      - name: マイクへのアクセスを許可
        shell: pwsh
        run: |
          $base = 'CapabilityAccessManager\ConsentStore\microphone'
          $paths = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\$base",
                   "HKCU:\Software\Microsoft\Windows\CurrentVersion\$base",
                   "HKCU:\Software\Microsoft\Windows\CurrentVersion\$base\NonPackaged"
          foreach ($p in $paths) {
            if (-not (Test-Path $p)) { New-Item -Path $p -Force | Out-Null }
            Set-ItemProperty -Path $p -Name Value -Value Allow
          }

      - name: ビルド
        run: cargo build -p kiroscribe-core --example hold_mic --example meeting_probe --locked

      - name: セッションの状態の変わり方
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $probe = 'target/debug/examples/meeting_probe.exe'
          # 確認用の道具を 1 回動かし、一覧を取れなかったら（終了コードが 0 でなければ）失敗にする
          function Invoke-Probe([string]$label, [switch]$RequireActive) {
            "=== $label"
            $output = (& $probe --once --require-sessions) -join "`n"
            $code = $LASTEXITCODE
            $output
            if ($code -ne 0) { throw "meeting_probe が失敗しました（$label、$code）" }
            if ($RequireActive -and ($output -notmatch '(?m)^\s*active\s+zoom\.exe\b.*→ 会議アプリ:' -or $output -notmatch '(?m)^\s*active\s+discord\.exe\b.*→ 会議アプリ:')) {
              throw 'Zoom.exe と Discord.exe の Active セッションを取得できませんでした'
            }
          }
          $apps = @{}
          foreach ($name in 'Zoom', 'Discord') {
            $dir = Join-Path $env:RUNNER_TEMP "states-$name"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Copy-Item target/debug/examples/hold_mic.exe (Join-Path $dir "$name.exe")
            $apps[$name] = Join-Path $dir "$name.exe"
          }
          # Zoom.exe: 6 秒使ったあと、ストリームを止めて（閉じずに）40 秒待つ。Discord.exe: 6 秒使ったあと、閉じて 40 秒待つ
          $zoom = Start-Process -FilePath $apps['Zoom'] -ArgumentList '6', '--pause', '40' -PassThru -WindowStyle Hidden
          $discord = Start-Process -FilePath $apps['Discord'] -ArgumentList '6', '--drop', '40' -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 3
            Invoke-Probe '3 秒後（どちらもマイクを使っている）' -RequireActive
            Start-Sleep -Seconds 7
            Invoke-Probe '10 秒後（Zoom.exe はストリームを止めた・Discord.exe は閉じた。どちらもプロセスは残っている）'
            Start-Sleep -Seconds 25
            Invoke-Probe '35 秒後（同じ）'
          } finally {
            Stop-Process -Id $zoom.Id, $discord.Id -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 3
          Invoke-Probe 'プロセスが終わったあと'

  # 会議中を示しうる手がかりが、実際に取れて表示されることを確かめる。
  # hold_mic を Slack.exe の名前で動かし（マイクを使い、既定の再生のデバイスに小さな音を流す）、
  # Edge で模擬の Google Meet のページ（退出・ミュート・カメラ・画面共有のボタンがある）を開く
  signals:
    name: 会議中を示しうる手がかり（Windows）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: 仮想のオーディオケーブルのインストール
        uses: LABSN/sound-ci-helpers@e9d6ba52163a3283714a68412036ddf33f78d49c # v1

      - name: マイクへのアクセスを許可
        shell: pwsh
        run: |
          $base = 'CapabilityAccessManager\ConsentStore\microphone'
          $paths = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\$base",
                   "HKCU:\Software\Microsoft\Windows\CurrentVersion\$base",
                   "HKCU:\Software\Microsoft\Windows\CurrentVersion\$base\NonPackaged"
          foreach ($p in $paths) {
            if (-not (Test-Path $p)) { New-Item -Path $p -Force | Out-Null }
            Set-ItemProperty -Path $p -Name Value -Value Allow
          }

      - name: ビルド
        run: cargo build -p kiroscribe-core --example hold_mic --example meeting_probe --locked

      - name: 手がかりの表示
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $probe = (Resolve-Path 'target/debug/examples/meeting_probe.exe').Path
          $work = Join-Path $env:RUNNER_TEMP 'signals'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $slack = Join-Path $work 'Slack.exe'
          Copy-Item target/debug/examples/hold_mic.exe $slack
          $page = Join-Path $work 'meet.html'
          @'
          <!doctype html><html><head><meta charset="utf-8"><title>Meet - abc-defg-hij</title></head><body>
          <button aria-label="Leave call">x</button>
          <button aria-label="Turn on microphone">m</button>
          <button aria-label="Turn off camera">c</button>
          <button aria-label="Share screen">s</button>
          <button>Reload</button>
          </body></html>
          '@ | Set-Content -Encoding UTF8 $page
          $edge = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          function Start-Edge([string[]]$extra) {
            $userData = Join-Path $work ("edge-" + [guid]::NewGuid())
            $edgeArgs = @('--no-first-run', '--no-default-browser-check', "--user-data-dir=$userData", '--new-window') + $extra + @("file:///$($page -replace '\\', '/')")
            Start-Process -FilePath $edge -ArgumentList $edgeArgs | Out-Null
          }
          # 確認用の道具を 1 回動かし、表示して、出力を返す
          function Invoke-Probe([string]$label) {
            Write-Host "=== $label"
            $output = (& $probe --once --titles --output (Join-Path $work 'once.txt')) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "meeting_probe が失敗しました（$label、$LASTEXITCODE）" }
            Write-Host $output
            return $output
          }
          $controls = '(?m)^\s*部品 msedge\.exe 0x[0-9a-f]+ 退出=あり'
          # 窓の中の部品が出るまで、何回か調べる（ブラウザが部品の情報を作るまで時間がかかることがある）
          function Wait-Controls([string]$label) {
            for ($i = 1; $i -le 6; $i++) {
              Start-Sleep -Seconds 3
              $output = Invoke-Probe "$label（$i 回目）"
              if ($output -match $controls) { break }
            }
            return $output
          }
          $hold = Start-Process -FilePath $slack -ArgumentList '120', '--play' -PassThru -WindowStyle Hidden
          Start-Edge @()
          $failures = @()
          try {
            $output = Wait-Controls 'Edge（既定の起動）'
            $plain = $output -match $controls
            "既定の起動の Edge で、窓の中の部品を読めたか: $plain"
            if (-not $plain) {
              Stop-Process -Name msedge -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
              Start-Edge @('--force-renderer-accessibility')
              $output = Wait-Controls 'Edge（--force-renderer-accessibility）'
            }
            $checks = [ordered]@{
              '録音の端点の一覧'           = '(?m)^\s*録音の端点: \d+ 台'
              '録音のセッション（端点ごと・ピーク）' = '(?m)^\s*録音 端点\d+ slack\.exe pid=\d+ active ピーク \d\.\d{3}'
              '再生のセッション（音あり）'   = '(?m)^\s*再生 端点\d+ slack\.exe pid=\d+ active ピーク \d\.\d{3}（(小|中|大)）'
              '会議のページの窓'           = '(?m)^\s*窓 msedge\.exe 0x[0-9a-f]+ クラス=Chrome_WidgetWin_1 .*会議らしい名前（製品の判定では Google Meet）「Meet - abc-defg-hij'
              '退出のボタン'               = '(?m)^\s*部品 msedge\.exe 0x[0-9a-f]+ 退出=あり（Button）.*「Leave call」'
              'ミュートの解除のボタン'     = 'ミュート=あり（Button・解除の名前）'
              'カメラのボタン'             = 'カメラ=あり（Button）'
              '画面共有のボタン'           = '画面共有=あり（Button）'
              'カメラの使用状況'           = '(?m)^\s*カメラ（ConsentStore の webcam）: '
            }
            foreach ($name in $checks.Keys) {
              $ok = $output -match $checks[$name]
              "確認: $name → $ok"
              if (-not $ok) { $failures += $name }
            }
            # 続けて動かし、目印（標準入力の 1 行）とファイルへの書き出しを確かめる
            $stdin = Join-Path $work 'stdin.txt'
            'ci 目印' | Set-Content -Encoding UTF8 $stdin
            $file = Join-Path $work 'probe-output.txt'
            $running = Start-Process -FilePath $probe -ArgumentList '--output', $file -RedirectStandardInput $stdin -RedirectStandardOutput (Join-Path $work 'stdout.txt') -PassThru -WindowStyle Hidden
            Start-Sleep -Seconds 10
            Stop-Process -Id $running.Id -Force -ErrorAction SilentlyContinue
            $written = Get-Content -Raw -Encoding UTF8 $file
            "=== 書き出したファイル"
            $written
            if ($written -notmatch '(?m)^\[\d\d:\d\d:\d\d\] ◆ 目印 1: ci 目印') { $failures += '目印' }
            if ($written -notmatch '(?m)^\s*-- 会議中を示しうる手がかり') { $failures += 'ファイルへの書き出し' }
          } finally {
            Stop-Process -Id $hold.Id -Force -ErrorAction SilentlyContinue
            Stop-Process -Name msedge -Force -ErrorAction SilentlyContinue
          }
          if ($failures.Count -gt 0) { throw "出なかった手がかり: $($failures -join '、')" }
