[package]
name = "kiroscribe-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kiroscribe のUI非依存ロジック（保存・音声処理・文字起こし・Claude API）"

[features]
# E2E テスト用の差し替え口（接続先・音声・データの場所など。crates/core/src/e2e/）を有効にする。
# リリース用のビルドでは付けない
e2e = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
rusqlite = { version = "0.43", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "json", "multipart", "stream"] }
futures-util = "0.3"
cpal = "0.18"
keyring-core = "1"
# デバッグ用のログの書き出し（debug_bundle.rs）
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# 会議の検出の判定表（meeting_rules.toml）を読む
toml = "1"
# 会議の検出で、アドレスバーとページの URL からホスト名を取り出す（meeting_facts.rs）。reqwest と同じ版を使う
url = "2"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_Packaging_Appx", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
# 会議の検出で、オーディオのセッションの一覧と再生の音の大きさ（audio_sessions.rs）と、窓の中の部品（UI Automation・MSAA。
# meeting_facts.rs）を読む。cpal と同じ版を使う
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

# 資格情報マネージャーの中身を、keyring を通さずに Windows の API で直接確かめるテスト用。
# Graphics_Gdi・LibraryLoader・WindowsAndMessaging は、E2E テストの道具（examples/hold_mic.rs）が、会議の窓とボタンを出すため
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Credentials", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

# 確認用の道具の、OS によらない部分の単体テストを cargo test で動かす
[[example]]
name = "meeting_probe"
path = "examples/meeting_probe/main.rs"
test = true
