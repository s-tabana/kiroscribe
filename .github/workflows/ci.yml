# Kiroscribe の Windows ビルド・テスト・インストーラ生成
#
# - Secret は使わない（フォークからのプルリクエストでも同じ内容が動く）。
# - アクションは、タグではなくコミットのハッシュで固定している（タグは後から付け替えられるため）。
#   行末のコメントがそのバージョンで、Dependabot がハッシュとコメントをまとめて更新する。
name: ci

on:
  push:
    branches:
      - main
      - next
  pull_request:
  workflow_dispatch:

# プルリクエストでは、新しいコミットが来たら古いコミットの実行を止める（グループはプルリクエストごと）。
# main・next への push と手動の実行は、実行中のものは止めずに順番待ちにする
# （待っている間に新しい push が来たら、待っている方だけが置き換わる）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# このワークフローに渡すトークンは、リポジトリの読み取りだけ
permissions:
  contents: read

jobs:
  windows:
    name: Windows（テスト・インストーラ）
    runs-on: windows-latest
    steps:
      # persist-credentials: false … トークンを .git/config に残さない（後のステップで動く依存関係のコードから読めないようにする）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # このアクションにはバージョンのタグがないので、master ブランチのコミットで固定し、
      # ツールチェーンは入力で指定する（@stable と書くのと同じ動き）
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: 依存関係のインストール
        run: npm ci

      # package.json・Cargo.toml・tauri.conf.json のバージョンがそろっているか
      - name: バージョンの確認
        run: node scripts/check-version.mjs

      # 仕様一覧（docs/spec/）のすべての項目が、テストかリリース前のチェックリストに結び付いているか。
      # まだテストのない項目は、未対応の一覧（docs/spec/pending.txt）に載っているものだけ見逃す。
      # 件数の要約は、このジョブの Summary に出る
      - name: 仕様とテストの対応の確認
        run: node scripts/check-spec-coverage.mjs

      - name: リリース用スクリプトのテスト
        working-directory: scripts
        run: node --test

      - name: 型チェック
        run: npm run typecheck

      - name: フロントエンドのテスト
        run: npm run test:web

      # KIROSCRIBE_LIVE_TESTS: 本物の GitHub に問い合わせて、ヘルプの取得元がいまも読めることを確かめる
      # （crates/core/tests/live_github.rs。キーは使わない）。認証なしの GitHub の API の利用回数の上限で断られたときは、
      # 確かめずに警告を出して通る。Windows では、本物の資格情報マネージャーも使う
      - name: Rust のテスト
        env:
          KIROSCRIBE_LIVE_TESTS: "1"
        run: cargo test --workspace --locked

      # アプリ内更新の署名に使う秘密鍵は、リリース（release.yml）でだけ使う。
      # ここでは署名の要る成果物を作らない設定を重ねて、鍵なしでビルドする。
      # （bash にしているのは、PowerShell だと `--` 以降の引数が npm に正しく渡らないことがあるため）
      - name: インストーラのビルド
        shell: bash
        run: npm run tauri build -- --config scripts/tauri.ci.conf.json

      # E2E テスト用の差し替え口（cargo の feature `e2e`）は、配布するビルドには入れない
      - name: 配布するビルドに E2E テスト用のコードがないことの確認
        run: node e2e/check-release-binary.mjs target/release/kiroscribe.exe

      # zip に包まず、インストーラ（.exe）1 ファイルをそのまま保存する
      # （archive: false のときは成果物名がファイル名になる）
      - name: インストーラを成果物として保存
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/release/bundle/nsis/*.exe
          archive: false
          if-no-files-found: error
          retention-days: 14
