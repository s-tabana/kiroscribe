# Kiroscribe の E2E テスト（実際のアプリを起動して、画面を操作して確かめる）
#
# - E2E テスト用のビルド（cargo の feature `e2e`）を作り、tauri-driver と WebDriver で操作する（e2e/）。
#   外部の API・音声・会議の検出などは模擬のものに差し替わるので、Secret は使わない
#   （フォークからのプルリクエストでも同じ内容が動く）。
# - 配布する形（Windows）と、開発に使う Linux の両方で走らせる。
# - アクションは、タグではなくコミットのハッシュで固定している（タグは後から付け替えられるため）。
#   行末のコメントがそのバージョンで、Dependabot がハッシュとコメントをまとめて更新する。
name: e2e

on:
  push:
    branches:
      - main
      - next
  pull_request:
  workflow_dispatch:

# プルリクエストでは、新しいコミットが来たら古いコミットの実行を止める（グループはプルリクエストごと）。
# main・next への push と手動の実行は、実行中のものは止めずに順番待ちにする
# （待っている間に新しい push が来たら、待っている方だけが置き換わる）
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# このワークフローに渡すトークンは、リポジトリの読み取りだけ
permissions:
  contents: read

jobs:
  e2e:
    name: E2E（${{ matrix.name }}）
    runs-on: ${{ matrix.os }}
    # ふだんは 15 分ほど。WebDriver がつながらないときに待ち続けないようにする
    timeout-minutes: 60
    strategy:
      # 片方が失敗しても、もう片方の結果は見たい
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      # persist-credentials: false … トークンを .git/config に残さない（後のステップで動く依存関係のコードから読めないようにする）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # このアクションにはバージョンのタグがないので、master ブランチのコミットで固定し、
      # ツールチェーンは入力で指定する（@stable と書くのと同じ動き）
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Tauri のビルドに要るものと、E2E に要るもの（WebKitWebDriver、xvfb = 仮想の画面、
      # dbus = 多重起動の防止が使うセッション）。
      # WebKitWebDriver のパッケージは、Ubuntu の版によって名前が違う
      # （新しい版は webkitgtk-webdriver、24.04 までは webkit2gtk-driver）ので、あるほうを入れる。
      # 入れたあと、実行ファイルの場所を確かめて、E2E の起動スクリプトに渡す
      - name: システムの依存関係（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev \
            xvfb dbus
          sudo apt-get install -y --no-install-recommends webkitgtk-webdriver \
            || sudo apt-get install -y --no-install-recommends webkit2gtk-driver
          driver="$(command -v WebKitWebDriver || true)"
          if [ -z "$driver" ]; then
            driver="$(dpkg -L webkitgtk-webdriver webkit2gtk-driver 2>/dev/null | grep -m1 '/WebKitWebDriver$' || true)"
          fi
          if [ -z "$driver" ] || [ ! -x "$driver" ]; then
            echo "::error title=WebKitWebDriver がありません::パッケージを入れましたが、WebKitWebDriver の実行ファイルが見つかりません。"
            exit 1
          fi
          echo "WebKitWebDriver: $driver"
          echo "KIROSCRIBE_E2E_NATIVE_DRIVER=$driver" >> "$GITHUB_ENV"

      - name: 依存関係のインストール
        run: npm ci

      # tauri-driver は、WebDriver の命令を OS ごとのドライバー（Windows: msedgedriver、Linux: WebKitWebDriver）へ中継する。
      # バージョンは Tauri 本体とは独立している
      - name: tauri-driver のインストール
        run: cargo install tauri-driver --locked --version 2.1.0

      # msedgedriver は、このマシンの WebView2 と同じバージョンでないと接続できない。
      # Tauri の手引きと同じく msedgedriver-tool で、入っている WebView2 に合うものを取得する（コミットで固定）。
      # 置いた場所は、E2E の起動スクリプトが tauri-driver に --native-driver で渡す
      - name: msedgedriver の取得（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --locked
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          if (-not (Test-Path msedgedriver.exe)) { throw "msedgedriver.exe を取得できませんでした" }
          "KIROSCRIBE_E2E_NATIVE_DRIVER=$((Get-Item msedgedriver.exe).FullName)" >> $env:GITHUB_ENV

      # コマンドとイベントを模擬のランタイムで呼び、引数・戻り値の形が画面側の型と合うことを確かめる
      # （OS によらない内容なので Linux だけで走らせる。型との突き合わせは ci.yml の「型チェック」が行う）
      - name: コマンドとイベントの形の確認（Linux）
        if: runner.os == 'Linux'
        run: cargo test -p kiroscribe --features e2e --locked

      - name: E2E テスト用のアプリのビルド
        run: npm run build:e2e

      # Linux では、起動スクリプトが仮想の画面（xvfb-run）と D-Bus のセッションを用意する
      - name: E2E テスト
        run: npm run test:e2e

      - name: 失敗したテストのスクリーンショットとログを保存
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts-${{ matrix.name }}
          path: e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # 本物の音声デバイスでの録音（e2e/specs/14-real-audio.test.mjs）。
  # Windows のランナーには音声デバイスがないので、仮想のオーディオケーブル（VB-CABLE）を入れる。
  # 入れるのは、音声を扱うソフトウェアの CI で使われている LABSN/sound-ci-helpers（コミットで固定）。
  # VB-CABLE は vb-audio.com から取得する（寄付で支えられているソフトウェアで、この使い捨ての環境にだけ入れる）
  real-audio:
    name: E2E（Windows・本物の音声デバイス）
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: 仮想のオーディオケーブルのインストール
        uses: LABSN/sound-ci-helpers@e9d6ba52163a3283714a68412036ddf33f78d49c # v1

      # Windows のプライバシー設定で、デスクトップ アプリがマイクを使えるようにする（ランナーの既定では拒否されている）。
      # 拒否されているときの知らせは、テスト（REC-022）の中で切り替えて確かめる
      - name: マイクへのアクセスを許可
        shell: pwsh
        run: |
          $base = 'CapabilityAccessManager\ConsentStore\microphone'
          $paths = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\$base",
                   "HKCU:\Software\Microsoft\Windows\CurrentVersion\$base",
                   "HKCU:\Software\Microsoft\Windows\CurrentVersion\$base\NonPackaged"
          foreach ($p in $paths) {
            $before = (Get-ItemProperty -Path $p -Name Value -ErrorAction SilentlyContinue).Value
            if (-not (Test-Path $p)) { New-Item -Path $p -Force | Out-Null }
            Set-ItemProperty -Path $p -Name Value -Value Allow
            "$p : $before -> Allow"
          }
          Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy' -ErrorAction SilentlyContinue | Format-List

      - name: 音声デバイスの一覧
        shell: pwsh
        run: |
          Get-Service Audiosrv | Format-List Name, Status, StartType
          Get-PnpDevice -Class AudioEndpoint, MEDIA -ErrorAction SilentlyContinue | Format-Table -AutoSize Class, FriendlyName, Status

      - name: 依存関係のインストール
        run: npm ci

      - name: tauri-driver のインストール
        run: cargo install tauri-driver --locked --version 2.1.0

      - name: msedgedriver の取得
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --locked
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          if (-not (Test-Path msedgedriver.exe)) { throw "msedgedriver.exe を取得できませんでした" }
          "KIROSCRIBE_E2E_NATIVE_DRIVER=$((Get-Item msedgedriver.exe).FullName)" >> $env:GITHUB_ENV

      # hold_mic: マイクを開き、会議の窓を出して待つだけのプログラム。会議アプリの名前に写して、会議の検出を確かめる
      # meeting_probe: 会議の検出の確認用の道具（製品と同じ判定表の判定と、読んだ窓・部品・セッションを表示する）
      - name: E2E テスト用のアプリと、マイクを使うだけのプログラムのビルド
        run: |
          npm run build:e2e
          cargo build -p kiroscribe-core --example hold_mic --example meeting_probe --locked

      # hold_mic を Zoom.exe の名前で、Zoom の会議の窓のクラス（ZPContentViewWndClass）の窓を出して動かし、
      # 録音のセッションに Active で現れ、判定表で Zoom の会議の開始を確定することを、確認用の道具で確かめる
      # （窓・オーディオのセッションを読む部分の確認。MTG-020・MTG-027）。
      # 窓とセッションが現れるまでの遅れを見込み、2 秒ごとに 5 回まで調べる。失敗したときは、最後の表示を残す
      - name: 窓とオーディオのセッションからの会議の検出の確認
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $PSNativeCommandUseErrorActionPreference = $false
          $dir = Join-Path $env:RUNNER_TEMP 'probe-zoom'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target/debug/examples/hold_mic.exe (Join-Path $dir 'Zoom.exe')
          $zoom = Start-Process -FilePath (Join-Path $dir 'Zoom.exe') -ArgumentList '30', '--window', 'ZPContentViewWndClass' -PassThru
          try {
            $passed = $false
            foreach ($attempt in 1..5) {
              Start-Sleep -Seconds 2
              $output = (& target/debug/examples/meeting_probe.exe --once --require-sessions --expect zoom) -join "`n"
              $code = $LASTEXITCODE
              "--- $attempt 回目（終了コード $code）"
              $output
              if ($code -eq 0 -and $output -match '(?m)^\s*録音 active zoom\.exe' -and $output -match '会議の開始を確定: Zoom（') {
                $passed = $true
                break
              }
            }
            if (-not $passed) { throw 'Zoom の会議の窓と、録音のセッションの Active の zoom.exe から、Zoom の会議と判定できませんでした（最後の表示を参照）' }
          } finally {
            Stop-Process -Id $zoom.Id -Force -ErrorAction SilentlyContinue
          }

      - name: E2E テスト（本物の音声デバイス・会議の検出）
        env:
          KIROSCRIBE_E2E_REAL_AUDIO: "1"
        run: npm run test:e2e -- e2e/specs/14-real-audio.test.mjs e2e/specs/15-real-meeting.test.mjs

      # 失敗したときに、そのときのオーディオのセッションの一覧と判定を残す（ログを見て原因を切り分けるため）
      - name: 失敗したときの会議の検出の様子
        if: failure()
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $probe = 'target/debug/examples/meeting_probe.exe'
          if (Test-Path $probe) { & $probe --once --titles } else { '確認用の道具がビルドされていません' }
          exit 0

      - name: 失敗したテストのスクリーンショットとログを保存
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts-real-audio
          path: e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 14
